<!DOCcard html>
    <html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../../style/style.css">
        <title>Cards</title>
    </head>

    <body>
        <div class="container">
            <section class="cards">
                <each loop="item in cardsArray">
                    <include src="components/cards/card.html"
                        locals='{
                            "type": "{{ item.type }}",
                            "number": "{{ item.number }}",
                            "holder": "{{ item.holder }}",
                            "expiry": "{{ item.expiry }}"
                        }' />
                </each>
            </section>
        </div>

        <script src="../../js/cards.js"></script>
    </body>

    </html>
